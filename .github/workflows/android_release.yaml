name: TizenTubeCobalt Release

on:
  push:
    branches: [ 'release/**', 'main' ] # Consider if 'main' should also trigger full release builds or a subset
  workflow_dispatch:

env:
  MAIN_PROJECT_MODULE: app # Android specific
  COBALT_CONFIG_PATH: cobalt_config.json # Relative to repo root
  # This secret needs to be defined in GitHub repo secrets.
  # It's the path where Webpack's output (dist/) will be copied for Cobalt to use.
  # Example value for COBALT_APP_CONTENT_PATH_SECRET: "cobalt/src/myapp/web_assets" (relative to cobalt_path) or an absolute path in the runner
  # For now, the workflow will define COBALT_APP_CONTENT_PATH based on a temporary directory for clarity.
  # A more robust solution might involve checking out Cobalt into a specific path and then using that.

jobs:
  build-tizen:
    name: Build Tizen WGT Package
    runs-on: ubuntu-latest
    outputs: # Define outputs if other jobs depend on the WGT path or Tizen build status
      wgt_path: ${{ steps.upload_wgt.outputs.artifact_path }}/tizentube.wgt # Example output

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: 'recursive' # If Cobalt source is a submodule or has submodules

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      - name: Build JavaScript bundle with Webpack
        run: npx webpack --mode production --config webpack.config.js
        # Output is expected in 'dist/' directory by default from our webpack.config.js

      # Prepare COBALT_APP_CONTENT_PATH: This is where Webpack's output will be placed
      # for integration.py to use. This could be a directory within the Cobalt source tree
      # if Cobalt's build system (GN files) needs to directly reference these assets.
      # Or, it can be a temporary path that integration.py's package_app then uses.
      # For this example, let's assume COBALT_APP_CONTENT_PATH is where `dist` contents go.
      # If secrets.COBALT_APP_CONTENT_PATH is a relative path *within* the cobalt checkout,
      # this logic needs to be adjusted based on where cobalt is checked out or available.
      # Assuming COBALT_APP_CONTENT_PATH is a path accessible in the runner.
      - name: Prepare Cobalt Content Path
        id: prep_cobalt_content
        run: |
          CONTENT_PATH="${{ secrets.COBALT_APP_CONTENT_PATH }}"
          if [ -z "$CONTENT_PATH" ]; then
            echo "COBALT_APP_CONTENT_PATH secret not set. Using default './cobalt_content_for_build'."
            CONTENT_PATH="./cobalt_content_for_build"
          fi
          mkdir -p "$CONTENT_PATH"
          echo "COBALT_CONTENT_DIR=$CONTENT_PATH" >> $GITHUB_ENV
          echo "Using Cobalt content path: $CONTENT_PATH"

      - name: Copy Webpack output to Cobalt content path
        run: |
          echo "Copying Webpack output from 'dist/' to '${{ env.COBALT_CONTENT_DIR }}'..."
          if [ -d "dist" ]; then
            cp -r dist/* "${{ env.COBALT_CONTENT_DIR }}/"
            echo "Webpack output copied."
            ls -la "${{ env.COBALT_CONTENT_DIR }}"
          else
            echo "Error: Webpack 'dist' directory not found!"
            exit 1
          fi

      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Set up Tizen CLI
        run: |
          echo "Attempting to download Tizen Studio CLI..."
          # The exact URL and filename might change. Always verify from official Tizen sources.
          # This example uses a hypothetical URL for Tizen Studio 5.0 CLI.
          # Actual Tizen Studio installation is more involved (e.g., requires accepting licenses).
          # This step is a placeholder and likely needs a more robust setup for a real CI.
          # Using a Docker container with Tizen SDK pre-installed is often a better solution.
          curl -L -o tizen-studio-cli.bin http://download.tizen.org/sdk/InstallManager/Tizen_Studio_Setup/tizen-studio_5.5_ubuntu-64.bin || echo "Fallback: Tizen CLI download failed. Assuming pre-installed or handled by custom runner."
          if [ -f tizen-studio-cli.bin ]; then
            chmod +x tizen-studio-cli.bin
            # The Tizen Studio installer is typically interactive or needs specific silent install flags.
            # This is a simplified attempt and might not fully work without adjustments.
            echo "Attempting to install Tizen Studio CLI (this may require interaction or specific flags)..."
            # sudo ./tizen-studio-cli.bin --accept-license --no-java-check --install-path ~/tizen-studio || echo "Tizen Studio install command failed or was skipped."
            # Add Tizen tools to PATH (adjust path according to actual installation)
            # export PATH=$PATH:$HOME/tizen-studio/tools/ide/bin:$HOME/tizen-studio/tools
            echo "Placeholder: Tizen CLI setup complete (manual verification of PATH needed)."
          fi
          tizen version || echo "Tizen CLI not found or 'tizen version' command failed. Ensure Tizen CLI is in PATH."


      - name: Run Cobalt integration script
        run: python3 integration.py
        env:
          COBALT_APP_CONTENT_PATH: ${{ env.COBALT_CONTENT_DIR }} # Pass the prepared path
          PYTHONUNBUFFERED: 1

      - name: Upload Tizen WGT Package Artifact
        id: upload_wgt # Give an ID to reference its outputs if needed by other jobs
        uses: actions/upload-artifact@v4
        with:
          name: tizentube-wgt-package
          path: dist/tizentube.wgt # Should match output_dir in integration.py
          if-no-files-found: error

  build-android:
    name: Build Android AAB
    runs-on: ubuntu-latest
    needs: build-tizen # Optional: make Android build depend on Tizen build success
    if: success() # Only run if build-tizen succeeded (or remove 'needs' and 'if' to run in parallel)
    # continue-on-error: true # Uncomment if Tizen is primary and Android failure is acceptable

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Set up JDK 17 for Android
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: gradle

      - name: Make gradlew executable for Android
        run: |
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
          else
            echo "Warning: gradlew not found at root. Android build will be skipped."
            exit 0 # Exit successfully to not fail the job if Android is optional
          fi

      - name: Build Android Release AAB
        id: build_aab
        run: |
          if [ -f ./gradlew ]; then
            ./gradlew ${{ env.MAIN_PROJECT_MODULE }}:bundleRelease \
              -Pandroid.useAndroidX=true \
              -Pandroid.enableJetifier=true
            echo "aab_built=true" >> $GITHUB_OUTPUT
          else
            echo "Skipping Android AAB build: gradlew not found."
            echo "aab_built=false" >> $GITHUB_OUTPUT
          fi

      - name: Sign Android AAB
        if: steps.build_aab.outputs.aab_built == 'true' && hashFiles('${{ env.MAIN_PROJECT_MODULE }}/build/outputs/bundle/release/*.aab') != ''
        uses: r0adkll/sign-android-release@v1
        id: sign_app
        with:
          releaseDirectory: ${{ env.MAIN_PROJECT_MODULE }}/build/outputs/bundle/release
          signingKeyBase64: ${{ secrets.SIGNING_KEY }}
          alias: ${{ secrets.ALIAS }}
          keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}

      - name: Upload Signed Android AAB Artifact
        if: steps.build_aab.outputs.aab_built == 'true' && steps.sign_app.outputs.signedReleaseFile != ''
        uses: actions/upload-artifact@v4
        with:
          name: tizentube-app-bundle-aab
          path: ${{ steps.sign_app.outputs.signedReleaseFile }}
          if-no-files-found: warn

  notify_slack:
    name: Notify Slack
    runs-on: ubuntu-latest
    needs: [build-tizen, build-android] # Wait for both jobs
    if: always() # Always run this, regardless of previous job statuses

    steps:
      - name: Send Slack Notification
        uses: craftech-io/slack-action@v1
        with:
          slack-webhook: ${{ secrets.SLACK_WEBHOOK }}
          message: "TizenTubeCobalt Release Workflow completed. Tizen Status: ${{ needs.build-tizen.result }}, Android Status: ${{ needs.build-android.result }}. Commit: ${{ github.sha }}"
          status: ${{ needs.build-tizen.result == 'success' && needs.build-android.result == 'success' && 'success' || 'failure' }}
          channel: '#ci-alerts'
```
